    async function startImport() {
      const btn = document.getElementById("startBtn");
      btn.disabled = true;
      log.innerHTML = "";
      print(`Starting import of ${rawBooks.length} books...`, "info");

      let success = 0, failed = 0;
      for (let i = 0; i < rawBooks.length; i++) {
        const r = rawBooks[i];
        const title      = r[0].trim();
        const author     = clean(r[1]);
        const genre      = clean(r[2]);
        const currentPage= parseInt(r[3]) || 0;
        const finishDate = parseDate(r[4]);
        const finishYear = finishDate ? new Date(finishDate).getFullYear() : null;
        const totalPages = parseInt(r[9]) || 0;
        const status     = r[8].trim() || "Want to Read";
        const rating     = parseRating(r[7]);
        const notes      = rating > 0 ? `Rating: ${"★".repeat(rating)}${"☆".repeat(5-rating)}` : "";

        const book = {
          title, author, genre,
          currentPage, totalPages,
          status,
          finishDate,
          startDate: "",
          startYear: finishYear || new Date().getFullYear(),
          cover: "",
          notes,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        };

        try {
          await booksCol.add(book);
          success++;
          print(`[${i+1}/${rawBooks.length}] ✓ ${title}`);
        } catch (e) {
          failed++;
          print(`[${i+1}/${rawBooks.length}] ✗ ${title}: ${e.message}`, "error");
        }

        // small delay to avoid rate limit
        if (i % 10 === 9) await new Promise(r => setTimeout(r, 300));
      }

      print(`\nDone! ✓ ${success} imported, ✗ ${failed} failed.`, "done");
      btn.textContent = "Done!";
    }
